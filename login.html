    <!-- Corporate Branding Initializer -->
    <script>
    (function() {
        try {
            var s = localStorage.getItem('industria_branding_settings');
            var b = s ? JSON.parse(s) : null;
            if (!b) {
                var g = localStorage.getItem('industria_settings');
                if (g) { var p = JSON.parse(g); b = p ? p.branding : null; }
            }
            var root = document.documentElement;
            var primary = (b && b.primaryColor) ? b.primaryColor : '#059669';
            var primaryDark = (b && b.primaryDarkColor) ? b.primaryDarkColor : '#064e3b';
            var accent = (b && b.accentColor) ? b.accentColor : '#dcfce7';
            
            function toRgba(hex, alpha) {
                if (!hex) return 'rgba(5, 150, 105, ' + alpha + ')';
                hex = hex.replace('#', '');
                if (hex.length === 3) hex = hex.split('').map(function(c) { return c + c; }).join('');
                if (hex.length !== 6) return 'rgba(5, 150, 105, ' + alpha + ')';
                var num = parseInt(hex, 16);
                if (isNaN(num)) return 'rgba(5, 150, 105, ' + alpha + ')';
                return 'rgba(' + ((num >> 16) & 255) + ',' + ((num >> 8) & 255) + ',' + (num & 255) + ',' + alpha + ')';
            }

            root.style.setProperty('--primary', primary);
            root.style.setProperty('--primary-dark', primaryDark);
            root.style.setProperty('--accent', accent);
            root.style.setProperty('--secondary', primary);
            root.style.setProperty('--primary-light', toRgba(primary, 0.15));
            root.style.setProperty('--border-light', toRgba(primary, 0.12));
            root.style.setProperty('--primary-glow', toRgba(primary, 0.35));
            root.style.setProperty('--hero-gradient-start', toRgba(primaryDark, 0.88));
            root.style.setProperty('--hero-gradient-end', toRgba(primary, 0.65));
        } catch(e) {}
    })();
    </script>
    
    <style>
        /* High-Density Enterprise Scale (Calibrated to match 110% zoom experience natively) */
        html {
            font-size: 88.5%; /* ~14.16px base scale: recreates comfortable 110% zoom experience relative to 80% base at native 100% zoom */
            -webkit-text-size-adjust: 100%;
        }

        @media (max-width: 768px) {
            html {
                font-size: 87.5%; /* 14px on mobile phones for comfortable touch targets and readability */
            }
        }

        * {
            box-sizing: border-box;
        }

        .login-page {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--hero-gradient-start, rgba(2, 62, 138, 0.92)) 0%, var(--hero-gradient-end, rgba(0, 180, 216, 0.85)) 100%), url('assets/images/hero.jpg?v=31') center/cover no-repeat;
            padding: 1.5rem 1rem 4.5rem 1rem;
            box-sizing: border-box;
        }

        .login-card {
            background: var(--white);
            border-radius: 22px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.28), 0 0 0 1px rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 440px;
            padding: 2.75rem 2.5rem;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
            animation: cardFadeUp 0.35s ease-out;
        }

        @keyframes cardFadeUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--primary) 0%, #0284c7 50%, var(--secondary, #059669) 100%);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-brand {
            font-family: 'Outfit', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--primary-dark);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
            margin-bottom: 0.4rem;
            letter-spacing: -0.4px;
            max-width: 100%;
        }

        .login-brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--accent, #dcfce7);
            color: var(--primary, #059669);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            flex-shrink: 0;
        }

        .login-brand-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.92rem;
            margin: 0;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: #1e293b;
            font-size: 0.88rem;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .input-group .input-icon-left {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1rem;
            pointer-events: none;
            z-index: 2;
        }

        .login-card .form-control {
            width: 100% !important;
            height: 46px !important;
            padding: 0 1rem 0 2.85rem !important;
            border: 1.5px solid #cbd5e1 !important;
            border-radius: 10px !important;
            font-family: 'Inter', sans-serif !important;
            font-size: 0.95rem !important;
            transition: var(--transition) !important;
            background-color: #f8fafc !important;
            color: #0f172a !important;
            box-sizing: border-box !important;
        }

        @media (max-width: 768px) {
            .login-card .form-control {
                font-size: 16px !important; /* Strictly prevents auto-zoom on iOS */
            }
        }

        .login-card .form-control::placeholder {
            color: #94a3b8;
            opacity: 1;
        }

        .login-card .form-control:focus {
            outline: none !important;
            border-color: var(--primary) !important;
            background-color: var(--white) !important;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.16) !important;
        }

        .password-toggle-btn {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 0.4rem;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: color 0.2s ease;
            z-index: 2;
        }

        .password-toggle-btn:hover {
            color: var(--primary);
        }

        .login-card input[type="password"],
        .login-card input#password {
            padding-right: 2.75rem !important;
        }

        .login-btn {
            width: 100%;
            height: 46px;
            min-height: 46px;
            border-radius: 10px;
            font-size: 0.98rem;
            font-weight: 600;
            margin-top: 0.75rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(5, 150, 105, 0.3);
            cursor: pointer;
        }

        .error-message {
            color: #b91c1c;
            background: #fef2f2;
            border: 1px solid #fecaca;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.86rem;
            margin-bottom: 1.25rem;
            display: none;
            text-align: center;
            line-height: 1.35;
        }

        .error-message.show {
            display: block;
            animation: fadeIn 0.2s ease;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            margin-top: 1.5rem;
            padding: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s ease;
        }
        
        .back-link:hover {
            color: var(--primary);
        }

        /* Mobile Polish */
        @media (max-width: 480px) {
            .login-page {
                padding: 1rem 0.85rem 4.5rem 0.85rem;
                align-items: center;
            }

            .login-card {
                padding: 1.75rem 1.35rem 1.75rem 1.35rem;
                border-radius: 18px;
                max-width: 100%;
                box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.25);
            }

            .login-header {
                margin-bottom: 1.5rem;
            }

            .login-brand {
                font-size: 1.45rem;
                gap: 0.5rem;
            }

            .login-brand-icon {
                width: 32px;
                height: 32px;
                font-size: 1rem;
                border-radius: 8px;
            }

            .login-header p {
                font-size: 0.85rem;
            }

            .form-group {
                margin-bottom: 1rem;
            }

            .form-group label {
                font-size: 0.84rem;
                margin-bottom: 0.3rem;
            }

            .login-card .form-control {
                height: 46px !important;
                border-radius: 10px !important;
            }

            .login-btn {
                height: 48px;
                min-height: 48px;
                font-size: 0.98rem;
                margin-top: 0.5rem;
            }

            .back-link {
                margin-top: 1.25rem;
                font-size: 0.86rem;
            }
        }
    </style>
</head>
<body class="login-page">

    <div class="login-card">
        <div class="login-header">
            <a href="index.html" class="login-brand">
                <span class="login-brand-icon"><i class="fa-solid fa-industry"></i></span>
                <span class="login-brand-text">MyFactorySpace</span>
            </a>
            <p>Sign in to the Admin Dashboard</p>
        </div>

        <div class="error-message" id="login-error">
            Invalid username or password.
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-group">
                    <i class="fa-solid fa-user input-icon-left"></i>
                    <input type="text" id="username" class="form-control" placeholder="Enter your username" required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-group">
                    <i class="fa-solid fa-lock input-icon-left"></i>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                    <button type="button" id="toggle-password" class="password-toggle-btn" aria-label="Toggle password visibility">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary login-btn">Sign In <i class="fa-solid fa-arrow-right" style="margin-left: 8px;"></i></button>
        </form>
        
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Website</a>
    </div>

    <!-- Password visibility toggle script -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        var toggleBtn = document.getElementById('toggle-password');
        var pwdInput = document.getElementById('password');
        if (toggleBtn && pwdInput) {
            toggleBtn.addEventListener('click', function() {
                var isPassword = pwdInput.type === 'password';
                pwdInput.type = isPassword ? 'text' : 'password';
                var icon = toggleBtn.querySelector('i');
                if (icon) {
                    icon.className = isPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
                }
                toggleBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
            });
        }
    });
    </script>

    <!-- Supabase JS SDK & Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
